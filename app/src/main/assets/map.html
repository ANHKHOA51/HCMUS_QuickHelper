<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    var map = L.map('map').setView([10.762622, 106.660172], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var marker;

    function searchLocation(query) {
        fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + query)
            .then(res => res.json())
            .then(data => {
                if (data.length > 0) {
                    var result = data[0];
                    var lat = result.lat;
                    var lon = result.lon;

                    // Lấy dữ liệu name và display_name
                    // Đôi khi API không có field 'name', ta dùng tên query dự phòng
                    var locName = result.name ? result.name : query;
                    var locDisplayName = result.display_name ? result.display_name : "";

                    map.setView([lat, lon], 16);

                    if (marker) {
                        map.removeLayer(marker);
                    }

                    marker = L.marker([lat, lon])
                        .addTo(map)
                        .bindPopup(locName)
                        .openPopup();

                    // Truyền dữ liệu về cho Android Native xử lý
                    if (window.AndroidInterface) {
                        window.AndroidInterface.updateLocationInfo(locName, locDisplayName);
                    }
                } else {
                    alert("Không tìm thấy địa điểm");
                }
            })
            .catch(err => {
                alert("Lỗi tìm kiếm");
            });
    }
</script>

</body>
</html>
